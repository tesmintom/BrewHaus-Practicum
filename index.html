<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>BrewHaus Restaurant</title>
    <link rel='stylesheet' href='css/style.css'>
</head>
<body>
    <header class="site-header" id="home">
    <div class="container header-inner">
      <a href="#home" class="logo" aria-label="BrewHaus home">Brew<span>Haus</span></a>

      <nav class="main-nav" aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="#menu">Menu</a></li>
          <li><a href="#about">Our Story</a></li>
          <li><a href="#visit">Visit</a></li>
        </ul>

        <a href="#reservations" class="button button-outline">
          Reserve a Table
        </a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img
        class="hero-image"
        src="images/noir-hero.png"
        alt="BrewHaus Hero"
      >

      <div class="container hero-inner">
        <div class="hero-content">
          <h1 id="hero-title">An evening<br>to savour.</h1>

          <p class="hero-description">
            Seasonal ingredients. Thoughtful craftsmanship.<br>
            An intimate dining experience in the heart of Dubai.
          </p>

          <a href="#reservations" class="button button-primary">
            Reserve a Table
          </a>
        </div>
      </div>
    </section> 
  </main>
</body>
</html>
